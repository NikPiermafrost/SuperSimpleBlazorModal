name: publish

on:
  push:
    branches: [ main ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # enables GitHub OIDC token issuance for NuGet trusted publishing
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            11.0.x

      # Publish only when the csproj PackageVersion isn't on nuget.org yet,
      # so routine pushes to main don't fail on duplicate versions
      - name: Check if version already published
        id: version
        run: |
          VER=$(grep -oPm1 '(?<=<PackageVersion>)[^<]+' src/SuperSimpleBlazorModal/SuperSimpleBlazorModal.csproj)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if curl -fsSL "https://api.nuget.org/v3-flatcontainer/supersimpleblazormodal/index.json" | grep -qx "\"$VER\""; then
            echo "v$VER already published, skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Pack
        if: steps.version.outputs.skip != 'true'
        run: dotnet pack src/SuperSimpleBlazorModal -c Release -o artifacts

      - name: NuGet login (OIDC → temp API key)
        if: steps.version.outputs.skip != 'true'
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        if: steps.version.outputs.skip != 'true'
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

  gh-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Publish sample
        run: dotnet publish ./SuperSimpleBlazorModal.Sample/SuperSimpleBlazorModal.Sample.csproj --configuration Release --output build

      - name: GitHub Pages action
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/wwwroot
          allow_empty_commit: false
          keep_files: false
          force_orphan: true
